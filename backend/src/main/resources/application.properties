# =====================================================
# Supabase PostgreSQL via Session Pooler (IPv4-safe)
# All secrets come from Render Environment Variables
# =====================================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool settings (Fail fast on unreachable DB)
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=1800000

# JDBC Socket Timeouts (Prevents infinite hang during schema updates)
spring.datasource.hikari.data-source-properties.socketTimeout=15
spring.datasource.hikari.data-source-properties.connectTimeout=15
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Prevent hanging on metadata lock in some Postgres environments
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Render injects PORT dynamically; default to 8080 for local dev
server.port=${PORT:8080}
