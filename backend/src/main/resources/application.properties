# =====================================================
# Supabase PostgreSQL via Session Pooler (IPv4-safe)
# All secrets come from Render Environment Variables
# =====================================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool settings
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=1800000

# Force SSL: Supabase rejects non-SSL connections.
# If the user forgot ?sslmode=require in DATABASE_URL, this saves it.
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Prevent hanging on metadata lock in some Postgres environments (PgBouncer)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
# CRITICAL: When use_jdbc_metadata_defaults is false, dialect auto-detection fails. 
# We MUST explicitly provide the dialect, otherwise the app crashes on boot.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Render injects PORT dynamically; bind to all network interfaces
server.port=${PORT:8080}
server.address=0.0.0.0
