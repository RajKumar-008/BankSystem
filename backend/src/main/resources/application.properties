# =====================================================
# Supabase PostgreSQL via Session Pooler (IPv4-safe)
# All secrets come from Render Environment Variables
# =====================================================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate
# NOTE: Do NOT set spring.jpa.database-platform — Spring Boot 3.x auto-detects PostgreSQL dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Render injects PORT dynamically; default to 8080 for local dev
server.port=${PORT:8080}
